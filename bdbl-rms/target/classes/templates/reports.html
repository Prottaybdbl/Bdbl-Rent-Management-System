<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta th:replace="~{layout :: head('Reports')}">
</head>

<body>
    <div th:replace="~{layout :: sidebar('reports')}"></div>
    <div class="main-content">
        <header style="margin-bottom: 2rem;">
            <h1 style="font-size: 1.8rem; font-weight: 700;">Reports</h1>
            <p style="color: var(--text-secondary); margin-top: 4px; font-size: 0.95rem;">Generate financial and
                occupancy reports.</p>
        </header>
        <div
            style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; margin-bottom: 2rem;">
            <!-- Revenue Card -->
            <div
                style="background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; padding: 1.5rem; box-shadow: var(--shadow); position: relative; overflow: hidden;">
                <h3
                    style="color: var(--text-secondary); font-size: 0.9rem; font-weight: 600; text-transform: uppercase; margin-bottom: 0.5rem; letter-spacing: 0.05em;">
                    Total Monthly Revenue</h3>
                <div style="font-size: 2rem; font-weight: 700; color: var(--text-primary); margin-bottom: 4px;"
                    th:text="${metrics.totalMonthlyRevenue != null ? '৳ ' + #numbers.formatDecimal(metrics.totalMonthlyRevenue, 0, 'COMMA', 2, 'POINT') : '৳ 0'}">
                    ৳ 0</div>
                <div style="color: #10b981; font-size: 0.85rem; font-weight: 600;">Current Month Output</div>
                <div
                    style="position: absolute; right: -20px; bottom: -20px; font-size: 6rem; opacity: 0.04; pointer-events: none;">
                    📈</div>
            </div>

            <!-- Occupancy Card -->
            <div
                style="background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; padding: 1.5rem; box-shadow: var(--shadow); position: relative; overflow: hidden;">
                <h3
                    style="color: var(--text-secondary); font-size: 0.9rem; font-weight: 600; text-transform: uppercase; margin-bottom: 0.5rem; letter-spacing: 0.05em;">
                    Occupancy Rate</h3>
                <div style="font-size: 2rem; font-weight: 700; color: var(--text-primary); margin-bottom: 4px;"
                    th:text="${metrics.occupancyRate != null ? metrics.occupancyRate + '%' : '0%'}">0%</div>
                <div style="color: #3b82f6; font-size: 0.85rem; font-weight: 600;">Across all branches</div>
                <div
                    style="position: absolute; right: -20px; bottom: -20px; font-size: 6rem; opacity: 0.04; pointer-events: none;">
                    🏢</div>
            </div>

            <!-- Arrears Card -->
            <div
                style="background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; padding: 1.5rem; box-shadow: var(--shadow); position: relative; overflow: hidden;">
                <h3
                    style="color: var(--text-secondary); font-size: 0.9rem; font-weight: 600; text-transform: uppercase; margin-bottom: 0.5rem; letter-spacing: 0.05em;">
                    Outstanding Arrears</h3>
                <div style="font-size: 2rem; font-weight: 700; color: #ef4444; margin-bottom: 4px;"
                    th:text="${metrics.outstandingArrears != null ? '৳ ' + #numbers.formatDecimal(metrics.outstandingArrears, 0, 'COMMA', 2, 'POINT') : '৳ 0'}">
                    ৳ 0</div>
                <div style="color: #ef4444; font-size: 0.85rem; font-weight: 600;">Pending Collection</div>
                <div
                    style="position: absolute; right: -20px; bottom: -20px; font-size: 6rem; opacity: 0.04; pointer-events: none;">
                    ⚠️</div>
            </div>
        </div>

        <div
            style="background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; padding: 2rem; box-shadow: var(--shadow); text-align: center;">
            <p style="color: var(--text-secondary); font-size: 0.95rem;">More detailed export/reporting options (Excel,
                PDF) will be available in future phases.</p>
        </div>
    </div>
</body>

</html>
