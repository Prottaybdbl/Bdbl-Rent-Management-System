# ===========================================
# BDBL Rent Management System
# Application Configuration
# ===========================================

spring.application.name=BDBL-RMS

# ===========================================
# DATABASE (MySQL)
# ===========================================
spring.datasource.url=jdbc:mysql://localhost:3306/brms?useSSL=false&serverTimezone=Asia/Dhaka&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Qwertyuiop
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===========================================
# THYMELEAF
# ===========================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# ===========================================
# FILE UPLOAD
# ===========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads

# ===========================================
# SERVER
# ===========================================
server.port=8080

# ===========================================
# LOGGING
# ===========================================
logging.level.com.bdbl.rms=DEBUG
logging.level.org.hibernate.SQL=DEBUG
