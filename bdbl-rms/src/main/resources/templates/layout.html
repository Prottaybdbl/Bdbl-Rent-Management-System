<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head th:fragment="head(title)">
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title th:text="${title} + ' - BDBL Rent Management System'">BDBL RMS</title>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f4f8;
            --sidebar-color: #ffffff;
            --accent-color: #0077cc;
            --accent-secondary: #005fa3;
            --text-primary: #1a202c;
            --text-secondary: #718096;
            --glass-bg: #ffffff;
            --glass-border: #e2e8f0;
            --card-gradient: linear-gradient(135deg, rgba(0, 119, 204, 0.08), rgba(0, 95, 163, 0.04));
            --success: #00a876;
            --warning: #e6a800;
            --error: #e03e3e;
            --shadow: 0 2px 16px rgba(0, 0, 0, 0.07);
        }

        .dark {
            --bg-color: #0a0e17;
            --sidebar-color: rgba(17, 25, 40, 0.75);
            --accent-color: #00d4ff;
            --accent-secondary: #0055ff;
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --card-gradient: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(0, 85, 255, 0.05));
            --success: #00f2ad;
            --warning: #ffb300;
            --error: #ff4d4d;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            transition: background-color 0.3s, border-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Sidebar Design */
        .sidebar {
            width: 260px;
            background: var(--sidebar-color);
            backdrop-filter: blur(16px);
            border-right: 1px solid var(--glass-border);
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
            box-shadow: 2px 0 12px rgba(0, 0, 0, 0.05);
        }

        .dark .sidebar {
            box-shadow: none;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span {
            background: linear-gradient(to right, var(--accent-color), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .nav-item {
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-secondary);
            font-weight: 500;
            transition: 0.2s;
        }

        .nav-item:hover {
            background: var(--glass-bg);
            color: var(--text-primary);
            border-color: var(--glass-border);
        }

        .nav-item.active {
            background: var(--card-gradient);
            color: var(--accent-color);
            border-left: 4px solid var(--accent-color);
            font-weight: 600;
        }

        .dark .nav-item.active {
            color: var(--text-primary);
        }

        .theme-toggle {
            display: flex;
            width: 100%;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 16px;
            border-radius: 12px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 1rem;
            margin-top: auto;
        }

        .theme-toggle:hover {
            border-color: var(--accent-color);
        }

        .dark .icon-light {
            display: block !important;
        }

        .dark .icon-dark {
            display: none !important;
        }

        .logout-btn {
            display: flex;
            width: 100%;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            background: rgba(224, 62, 62, 0.1);
            border: 1px solid transparent;
            color: var(--error);
            cursor: pointer;
            transition: 0.3s;
            font-weight: 500;
            font-family: 'Outfit', sans-serif;
            text-decoration: none;
        }

        .logout-btn:hover {
            background: rgba(224, 62, 62, 0.15);
            border-color: rgba(224, 62, 62, 0.3);
        }

        /* Main Content wrapper */
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 2rem 3rem;
        }
    </style>
    <script>
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
        function toggleDarkMode() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
            }
        }
    </script>
</head>

<body>

    <!-- ===== SIDEBAR FRAGMENT ===== -->
    <div th:fragment="sidebar(activePage)" class="sidebar">
        <div class="logo">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent-color)">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>BDBL</span>
        </div>

        <nav class="nav-links">
            <a th:href="@{/dashboard}"
                th:class="${activePage == 'dashboard' ? 'nav-item active' : 'nav-item'}">Dashboard</a>
            <a th:href="@{/buildings}"
                th:class="${activePage == 'buildings' ? 'nav-item active' : 'nav-item'}">Buildings</a>
            <a th:href="@{/tenants}" th:class="${activePage == 'tenants' ? 'nav-item active' : 'nav-item'}">Tenants</a>
            <a th:href="@{/agreements}"
                th:class="${activePage == 'agreements' ? 'nav-item active' : 'nav-item'}">Agreements</a>
            <a th:href="@{/billing}" th:class="${activePage == 'billing' ? 'nav-item active' : 'nav-item'}">Billing &
                Utility</a>
            <a th:href="@{/payments}"
                th:class="${activePage == 'payments' ? 'nav-item active' : 'nav-item'}">Payments</a>
            <a th:href="@{/reports}" th:class="${activePage == 'reports' ? 'nav-item active' : 'nav-item'}">Reports</a>
            <a th:href="@{/settings}" th:class="${activePage == 'settings' ? 'nav-item active' : 'nav-item'}"
                style="margin-top: auto;">Settings</a>

            <button onclick="toggleDarkMode()" class="theme-toggle">
                <span style="font-size: 0.85rem; font-weight: 600;">Appearance</span>
                <svg class="icon-dark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" style="display: block;">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                <svg class="icon-light" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" style="display: none; color: #ffb300;">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </button>
            <form th:action="@{/logout}" method="post" style="width: 100%;">
                <button type="submit" class="logout-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    Logout
                </button>
            </form>
        </nav>
    </div>

</body>

</html>
