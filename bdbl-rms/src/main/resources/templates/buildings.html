<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta th:replace="~{layout :: head('Buildings')}">
</head>

<body>
    <div th:replace="~{layout :: sidebar('buildings')}"></div>
    <div class="main-content">
        <header style="margin-bottom: 2rem;">
            <h1 style="font-size: 1.8rem; font-weight: 700;">Buildings</h1>
            <p style="color: var(--text-secondary); margin-top: 4px; font-size: 0.95rem;">Manage all properties and
                buildings.</p>
        </header>
        <!-- Actions Top Bar -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <div style="position: relative; width: 300px;">
                <svg style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-secondary);"
                    width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" placeholder="Search buildings..."
                    style="width: 100%; padding: 10px 10px 10px 40px; border-radius: 12px; border: 1px solid var(--glass-border); background: var(--glass-bg); color: var(--text-primary); outline: none; transition: 0.3s;">
            </div>

            <button onclick="openModal()"
                style="background: var(--accent-color); color: white; padding: 10px 20px; border-radius: 12px; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; border: none; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(0, 119, 204, 0.3);">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Add Building
            </button>
        </div>

        <div th:if="${successMessage}"
            style="background: #d1fae5; color: #065f46; padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem; border: 1px solid #10b981;">
            <span th:text="${successMessage}">Success!</span>
        </div>
        <div th:if="${errorMessage}"
            style="background: #fee2e2; color: #991b1b; padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem; border: 1px solid #ef4444;">
            <span th:text="${errorMessage}">Error!</span>
        </div>

        <div
            style="background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; padding: 1.5rem; box-shadow: var(--shadow); overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr>
                        <th
                            style="text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--glass-border); color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase; font-weight: 600;">
                            Code</th>
                        <th
                            style="text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--glass-border); color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase; font-weight: 600;">
                            Name</th>
                        <th
                            style="text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--glass-border); color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase; font-weight: 600;">
                            Location</th>
                        <th
                            style="text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--glass-border); color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase; font-weight: 600;">
                            Floors</th>
                        <th
                            style="text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--glass-border); color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase; font-weight: 600;">
                            Area per Floor (Sft)</th>
                        <th
                            style="text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--glass-border); color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase; font-weight: 600;">
                            Status</th>
                        <th
                            style="text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--glass-border); color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase; font-weight: 600;">
                            Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(buildings)}">
                        <td colspan="7" style="text-align: center; padding: 2rem; color: var(--text-secondary);">
                            No buildings found in the system.
                        </td>
                    </tr>
                    <tr th:each="building : ${buildings}" style="border-bottom: 1px solid rgba(0,0,0,0.03);">
                        <td style="padding: 14px; font-weight: 600;" th:text="${building.code}">BLD01</td>
                        <td style="padding: 14px;" th:text="${building.name}">Main Tower</td>
                        <td style="padding: 14px;">
                            <span th:text="${building.address}">Address</span><br>
                            <small style="color: var(--text-secondary);" th:text="${building.city}">City</small>
                        </td>
                        <td style="padding: 14px;" th:text="${building.totalFloors}">10</td>
                        <td style="padding: 14px;" th:text="${building.totalAreaSft}">50000</td>
                        <td style="padding: 14px;">
                            <span th:if="${building.status == 'ACTIVE'}"
                                style="background: #d1fae5; color: #065f46; padding: 4px 10px; border-radius: 50px; font-size: 0.72rem; font-weight: 700;">ACTIVE</span>
                            <span th:if="${building.status != 'ACTIVE'}"
                                style="background: #fee2e2; color: #991b1b; padding: 4px 10px; border-radius: 50px; font-size: 0.72rem; font-weight: 700;"
                                th:text="${building.status}">INACTIVE</span>
                        </td>
                        <td style="padding: 14px;">
                            <a th:href="@{'/buildings/' + ${building.id}}"
                                style="color: var(--accent-color); text-decoration: none; font-size: 0.85rem; font-weight: 600;">View
                                Details</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add Building Modal -->
    <div id="buildingModal"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
        <div
            style="background: var(--bg-primary); width: 500px; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); border: 1px solid var(--glass-border);">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
                <h2 style="font-size:1.4rem; font-weight:700;">Add New Building</h2>
                <button onclick="closeModal()"
                    style="background:none; border:none; color:var(--text-secondary); cursor:pointer;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <form th:action="@{/buildings/save}" th:object="${newBuilding}" method="POST">
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-bottom:15px;">
                    <div>
                        <label
                            style="display:block; margin-bottom:5px; font-size:0.85rem; font-weight:600;">Code</label>
                        <input type="text" th:field="*{code}" required
                            style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--text-primary);">
                    </div>
                    <div>
                        <label
                            style="display:block; margin-bottom:5px; font-size:0.85rem; font-weight:600;">Name</label>
                        <input type="text" th:field="*{name}" required
                            style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--text-primary);">
                    </div>
                </div>
                <div style="margin-bottom:15px;">
                    <label style="display:block; margin-bottom:5px; font-size:0.85rem; font-weight:600;">Address</label>
                    <input type="text" th:field="*{address}"
                        style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--text-primary);">
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-bottom:15px;">
                    <div>
                        <label
                            style="display:block; margin-bottom:5px; font-size:0.85rem; font-weight:600;">City</label>
                        <input type="text" th:field="*{city}"
                            style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--text-primary);">
                    </div>
                    <div>
                        <label
                            style="display:block; margin-bottom:5px; font-size:0.85rem; font-weight:600;">District</label>
                        <input type="text" th:field="*{district}"
                            style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--text-primary);">
                    </div>
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-bottom:20px;">
                    <div>
                        <label style="display:block; margin-bottom:5px; font-size:0.85rem; font-weight:600;">Total
                            Floors</label>
                        <input type="number" th:field="*{totalFloors}"
                            style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--text-primary);">
                    </div>
                    <div>
                        <label style="display:block; margin-bottom:5px; font-size:0.85rem; font-weight:600;">Area
                            per Floor (Sft)</label>
                        <input type="number" step="0.01" th:field="*{totalAreaSft}"
                            style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--text-primary);">
                    </div>
                </div>
                <button type="submit"
                    style="width:100%; background:var(--accent-color); color:white; padding:12px; border-radius:12px; border:none; font-weight:600; cursor:pointer; box-shadow:0 4px 15px rgba(0,119,204,0.3);">
                    Create Building
                </button>
            </form>
        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById('buildingModal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('buildingModal').style.display = 'none';
        }
        // Close modal when clicking outside
        window.onclick = function (event) {
            let modal = document.getElementById('buildingModal');
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>

</html>
