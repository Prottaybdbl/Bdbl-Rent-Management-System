<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head th:replace="~{layout :: head('Tenants')}"></head>

<body>

    <div th:replace="~{layout :: sidebar('tenants')}"></div>

    <div class="main-content">
        <style>
            header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 2rem;
            }

            h1 {
                font-size: 1.8rem;
                font-weight: 700;
            }

            .subtitle {
                color: var(--text-secondary);
                margin-top: 4px;
                font-size: 0.95rem;
            }

            .toolbar {
                display: flex;
                gap: 12px;
                align-items: center;
                margin-bottom: 1.5rem;
            }

            .search-bar {
                background: var(--glass-bg);
                border: 1px solid var(--glass-border);
                padding: 10px 18px;
                border-radius: 12px;
                width: 300px;
                color: var(--text-primary);
                font-size: 0.9rem;
                outline: none;
                box-shadow: var(--shadow);
                transition: 0.2s;
            }

            .search-bar:focus {
                border-color: var(--accent-color);
                box-shadow: 0 0 0 3px rgba(0, 119, 204, 0.1);
            }

            .search-bar::placeholder {
                color: var(--text-secondary);
            }

            .btn {
                padding: 10px 20px;
                border-radius: 10px;
                border: none;
                font-weight: 600;
                cursor: pointer;
                transition: 0.2s;
            }

            .btn-primary {
                background: var(--accent-color);
                color: #fff;
                box-shadow: 0 2px 10px rgba(0, 119, 204, 0.25);
            }

            .btn-primary:hover {
                background: var(--accent-secondary);
                transform: translateY(-1px);
            }

            .tenant-table-container {
                background: var(--glass-bg);
                border: 1px solid var(--glass-border);
                border-radius: 20px;
                padding: 1.5rem;
                overflow: hidden;
                box-shadow: var(--shadow);
            }

            table {
                width: 100%;
                border-collapse: collapse;
            }

            th {
                text-align: left;
                padding: 12px 14px;
                color: var(--text-secondary);
                font-size: 0.75rem;
                font-weight: 600;
                border-bottom: 1px solid var(--glass-border);
                text-transform: uppercase;
                letter-spacing: 0.05em;
            }

            td {
                padding: 16px 14px;
                font-size: 0.9rem;
                border-bottom: 1px solid rgba(0, 0, 0, 0.03);
            }

            .dark td {
                border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            }

            tr:last-child td {
                border-bottom: none;
            }

            tr:hover td {
                background: rgba(0, 0, 0, 0.02);
            }

            .dark tr:hover td {
                background: rgba(255, 255, 255, 0.02);
            }

            .tenant-info {
                display: flex;
                align-items: center;
                gap: 12px;
            }

            .tenant-logo {
                width: 40px;
                height: 40px;
                border-radius: 10px;
                background: rgba(0, 0, 0, 0.04);
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: 700;
                border: 1px solid var(--glass-border);
                font-size: 0.85rem;
            }

            .dark .tenant-logo {
                background: rgba(255, 255, 255, 0.04);
            }

            .tenant-name {
                font-weight: 600;
                color: var(--text-primary);
            }

            .tenant-type {
                font-size: 0.75rem;
                color: var(--text-secondary);
                margin-top: 2px;
            }

            .status-badge {
                padding: 4px 10px;
                border-radius: 50px;
                font-size: 0.72rem;
                font-weight: 700;
                letter-spacing: 0.04em;
            }

            .status-active {
                background: #d1fae5;
                color: #065f46;
            }

            .status-expired {
                background: #fee2e2;
                color: #991b1b;
            }

            .dark .status-active {
                background: rgba(0, 242, 173, 0.15);
                color: var(--success);
            }

            .dark .status-expired {
                background: rgba(255, 77, 77, 0.15);
                color: var(--error);
            }

            .btn-action {
                padding: 6px 14px;
                border-radius: 8px;
                border: 1px solid var(--glass-border);
                background: var(--glass-bg);
                color: var(--text-primary);
                cursor: pointer;
                font-weight: 600;
                font-size: 0.82rem;
                transition: 0.2s;
            }

            .btn-action:hover {
                border-color: var(--accent-color);
                color: var(--accent-color);
            }

            .btn-renew {
                color: var(--error);
                border-color: rgba(255, 77, 77, 0.3);
                background: rgba(255, 77, 77, 0.05);
            }

            .btn-renew:hover {
                background: rgba(255, 77, 77, 0.1);
                border-color: var(--error);
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .main-content>* {
                animation: fadeIn 0.6s ease forwards;
            }
        </style>

        <header>
            <div>
                <h1>Tenant Management</h1>
                <p class="subtitle">View and manage all registered tenants.</p>
            </div>
            <button onclick="openTenantModal()" class="btn btn-primary">+ Add Tenant</button>
        </header>

        <div th:if="${successMessage}"
            style="background: #d1fae5; color: #065f46; padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem; border: 1px solid #10b981;">
            <span th:text="${successMessage}">Success!</span>
        </div>
        <div th:if="${errorMessage}"
            style="background: #fee2e2; color: #991b1b; padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem; border: 1px solid #ef4444;">
            <span th:text="${errorMessage}">Error!</span>
        </div>

        <div class="toolbar">
            <input type="text" class="search-bar" placeholder="🔍 Search company or trade license...">
        </div>

        <div class="tenant-table-container">
            <table>
                <thead>
                    <tr>
                        <th>Company Name</th>
                        <th>Trade License</th>
                        <th>Contact Email</th>
                        <th>Phone</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(tenants)}">
                        <td colspan="6" style="text-align: center; padding: 2rem; color: var(--text-secondary);">
                            No tenants found in the system.
                        </td>
                    </tr>
                    <tr th:each="tenant : ${tenants}">
                        <td>
                            <div class="tenant-info">
                                <div class="tenant-logo" style="color: #e47911;"
                                    th:text="${tenant.companyName != null and tenant.companyName.length() > 0 ? tenant.companyName.substring(0,1).toUpperCase() : 'T'}">
                                    C</div>
                                <div>
                                    <div class="tenant-name" th:text="${tenant.companyName}">Company Name</div>
                                    <div class="tenant-type" th:text="${tenant.businessType}">Business Type</div>
                                </div>
                            </div>
                        </td>
                        <td style="color: var(--text-secondary); font-family: monospace; font-size: 0.85rem;"
                            th:text="${tenant.tradeLicenseNo}">TL-0000000</td>
                        <td th:text="${tenant.email}">email@example.com</td>
                        <td style="font-weight: 600;" th:text="${tenant.phonePrimary}">01700000000</td>
                        <td>
                            <span th:if="${tenant.status == 'ACTIVE'}" class="status-badge status-active">ACTIVE</span>
                            <span th:if="${tenant.status != 'ACTIVE'}" class="status-badge status-expired"
                                th:text="${tenant.status}">INACTIVE</span>
                        </td>
                        <td><button class="btn-action">Profile</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add Tenant Modal -->
    <div id="tenantModal"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
        <div
            style="background: var(--bg-primary); width: 600px; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); border: 1px solid var(--glass-border); max-height: 90vh; overflow-y: auto;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
                <h2 style="font-size:1.4rem; font-weight:700;">Register New Tenant</h2>
                <button onclick="closeTenantModal()"
                    style="background:none; border:none; color:var(--text-secondary); cursor:pointer;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <form th:action="@{/tenants/save}" th:object="${newTenant}" method="POST">
                <div style="margin-bottom:15px;">
                    <label style="display:block; margin-bottom:5px; font-size:0.85rem; font-weight:600;">Company
                        Name</label>
                    <input type="text" th:field="*{companyName}" required
                        style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--text-primary);">
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-bottom:15px;">
                    <div>
                        <label style="display:block; margin-bottom:5px; font-size:0.85rem; font-weight:600;">Business
                            Type</label>
                        <input type="text" th:field="*{businessType}"
                            style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--text-primary);">
                    </div>
                    <div>
                        <label style="display:block; margin-bottom:5px; font-size:0.85rem; font-weight:600;">Trade
                            License No</label>
                        <input type="text" th:field="*{tradeLicenseNo}"
                            style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--text-primary);">
                    </div>
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-bottom:15px;">
                    <div>
                        <label
                            style="display:block; margin-bottom:5px; font-size:0.85rem; font-weight:600;">Email</label>
                        <input type="email" th:field="*{email}"
                            style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--text-primary);">
                    </div>
                    <div>
                        <label
                            style="display:block; margin-bottom:5px; font-size:0.85rem; font-weight:600;">Phone</label>
                        <input type="text" th:field="*{phonePrimary}" required
                            style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--text-primary);">
                    </div>
                </div>
                <div style="margin-bottom:20px;">
                    <label style="display:block; margin-bottom:5px; font-size:0.85rem; font-weight:600;">Office
                        Address</label>
                    <textarea th:field="*{officeAddress}" rows="2"
                        style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--text-primary); resize: vertical;"></textarea>
                </div>
                <button type="submit"
                    style="width:100%; background:var(--accent-color); color:white; padding:12px; border-radius:12px; border:none; font-weight:600; cursor:pointer; box-shadow:0 4px 15px rgba(0,119,204,0.3);">
                    Register Tenant
                </button>
            </form>
        </div>
    </div>

    <script>
        function openTenantModal() {
            document.getElementById('tenantModal').style.display = 'flex';
        }
        function closeTenantModal() {
            document.getElementById('tenantModal').style.display = 'none';
        }
        window.onclick = function (event) {
            let modal = document.getElementById('tenantModal');
            if (event.target == modal) {
                closeTenantModal();
            }
        }
    </script>
</body>

</html>
