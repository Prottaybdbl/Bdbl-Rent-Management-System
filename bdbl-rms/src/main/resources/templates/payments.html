<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta th:replace="~{layout :: head('Payments')}">
</head>

<body>
    <div th:replace="~{layout :: sidebar('payments')}"></div>
    <div class="main-content">
        <header style="margin-bottom: 2rem;">
            <h1 style="font-size: 1.8rem; font-weight: 700;">Payments</h1>
            <p style="color: var(--text-secondary); margin-top: 4px; font-size: 0.95rem;">Track and manage transaction
                records.</p>
        </header>
        <div th:if="${successMessage}"
            style="background: #d1fae5; color: #065f46; padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem; border: 1px solid #10b981;">
            <span th:text="${successMessage}">Success!</span>
        </div>
        <div th:if="${errorMessage}"
            style="background: #fee2e2; color: #991b1b; padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem; border: 1px solid #ef4444;">
            <span th:text="${errorMessage}">Error!</span>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <div style="position: relative; width: 300px;">
                <svg style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-secondary);"
                    width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" placeholder="Search payments..."
                    style="width: 100%; padding: 10px 10px 10px 40px; border-radius: 12px; border: 1px solid var(--glass-border); background: var(--glass-bg); color: var(--text-primary); outline: none; transition: 0.3s;">
            </div>

            <button onclick="openPaymentModal()"
                style="background: var(--accent-color); color: white; padding: 10px 20px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s; box-shadow: 0 4px 15px rgba(0, 119, 204, 0.3);">
                Record Payment
            </button>
        </div>

        <div
            style="background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; padding: 1.5rem; box-shadow: var(--shadow); overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr>
                        <th
                            style="text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--glass-border); color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase;">
                            Payment Ref</th>
                        <th
                            style="text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--glass-border); color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase;">
                            Tenant</th>
                        <th
                            style="text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--glass-border); color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase;">
                            Method</th>
                        <th
                            style="text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--glass-border); color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase;">
                            Amount</th>
                        <th
                            style="text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--glass-border); color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase;">
                            Date</th>
                        <th
                            style="text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--glass-border); color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase;">
                            Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(payments)}">
                        <td colspan="6" style="text-align: center; padding: 2rem; color: var(--text-secondary);">
                            No payments recorded yet.
                        </td>
                    </tr>
                    <tr th:each="payment : ${payments}" style="border-bottom: 1px solid rgba(0,0,0,0.03);">
                        <td style="padding: 14px; font-weight: 600; font-family: monospace;"
                            th:text="${payment.paymentNumber}">PAY-001</td>
                        <td style="padding: 14px; font-weight: 600;" th:text="${payment.tenantCompanyName}">Company</td>
                        <td style="padding: 14px;">
                            <span th:text="${payment.paymentMethod}">BANK_TRANSFER</span><br>
                            <small th:if="${payment.transactionRef != null}" style="color: var(--text-secondary);"
                                th:text="${payment.transactionRef}">Ref: XX</small>
                            <small th:if="${payment.chequeNumber != null}" style="color: var(--text-secondary);"
                                th:text="${'Cheque: ' + payment.chequeNumber}">Cheque: XX</small>
                        </td>
                        <td style="padding: 14px; font-weight: 600;"
                            th:text="${payment.amount != null ? '৳ ' + #numbers.formatDecimal(payment.amount, 0, 'COMMA', 2, 'POINT') : '৳ 0'}">
                            ৳ 0</td>
                        <td style="padding: 14px; font-size: 0.85rem;"
                            th:text="${#temporals.format(payment.paymentDate, 'dd MMM yyyy')}">01 Jan 2026</td>
                        <td style="padding: 14px;">
                            <span th:if="${payment.status == 'COMPLETED'}"
                                style="background: #d1fae5; color: #065f46; padding: 4px 10px; border-radius: 50px; font-size: 0.72rem; font-weight: 700;">COMPLETED</span>
                            <span th:if="${payment.status != 'COMPLETED'}"
                                style="background: #fef3c7; color: #92400e; padding: 4px 10px; border-radius: 50px; font-size: 0.72rem; font-weight: 700;"
                                th:text="${payment.status}">PENDING</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Record Payment Modal -->
    <div id="paymentModal"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
        <div
            style="background: var(--bg-primary); width: 500px; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); border: 1px solid var(--glass-border);">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
                <h2 style="font-size:1.4rem; font-weight:700;">Record New Payment</h2>
                <button onclick="closePaymentModal()"
                    style="background:none; border:none; color:var(--text-secondary); cursor:pointer;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <form th:action="@{/payments/save}" th:object="${newPayment}" method="POST">
                <div style="margin-bottom:15px;">
                    <label style="display:block; margin-bottom:5px; font-size:0.85rem; font-weight:600;">Select
                        Bill</label>
                    <select th:field="*{rentBillId}" required
                        style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--text-primary);">
                        <option value="">-- Select Pending Bill --</option>
                        <option th:each="bill : ${pendingBills}" th:value="${bill.id}"
                            th:text="${bill.billNumber + ' - ' + bill.tenantCompanyName + ' (৳' + bill.outstandingAmount + ')'}">
                            Bill Info</option>
                    </select>
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-bottom:15px;">
                    <div>
                        <label
                            style="display:block; margin-bottom:5px; font-size:0.85rem; font-weight:600;">Amount</label>
                        <input type="number" step="0.01" th:field="*{amount}" required
                            style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--text-primary);">
                    </div>
                    <div>
                        <label style="display:block; margin-bottom:5px; font-size:0.85rem; font-weight:600;">Payment
                            Date</label>
                        <input type="date" th:field="*{paymentDate}" required
                            style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--text-primary);">
                    </div>
                </div>
                <div style="margin-bottom:15px;">
                    <label style="display:block; margin-bottom:5px; font-size:0.85rem; font-weight:600;">Payment
                        Method</label>
                    <select th:field="*{paymentMethod}" required
                        style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--text-primary);">
                        <option value="CASH">Cash</option>
                        <option value="CHEQUE">Cheque</option>
                        <option value="BANK_TRANSFER">Bank Transfer</option>
                        <option value="PAY_ORDER">Pay Order</option>
                    </select>
                </div>
                <div style="margin-bottom:20px;">
                    <label style="display:block; margin-bottom:5px; font-size:0.85rem; font-weight:600;">Transaction Ref
                        / Cheque No</label>
                    <input type="text" th:field="*{transactionRef}"
                        style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--text-primary);">
                </div>
                <button type="submit"
                    style="width:100%; background:var(--accent-color); color:white; padding:12px; border-radius:12px; border:none; font-weight:600; cursor:pointer; box-shadow:0 4px 15px rgba(0,119,204,0.3);">
                    Record Payment
                </button>
            </form>
        </div>
    </div>

    <script>
        function openPaymentModal() {
            document.getElementById('paymentModal').style.display = 'flex';
        }
        function closePaymentModal() {
            document.getElementById('paymentModal').style.display = 'none';
        }
        window.onclick = function (event) {
            let modal = document.getElementById('paymentModal');
            if (event.target == modal) {
                closePaymentModal();
            }
        }
    </script>
</body>

</html>
