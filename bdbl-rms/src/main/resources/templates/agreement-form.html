<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head th:replace="~{layout :: head('New Lease Agreement')}"></head>

<body>
    <div th:replace="~{layout :: sidebar('agreements')}"></div>
    <div class="main-content">
        <header style="margin-bottom: 2rem;">
            <h1 style="font-size: 1.8rem; font-weight: 700;">Create New Lease</h1>
            <p style="color: var(--text-secondary); margin-top: 4px; font-size: 0.95rem;">Step-by-step wizard for
                agreement creation.</p>
        </header>

        <div th:if="${errorMessage}"
            style="background: #fee2e2; color: #991b1b; padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem; border: 1px solid #ef4444;">
            <span th:text="${errorMessage}">Error!</span>
        </div>

        <div
            style="background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 24px; padding: 2rem; box-shadow: var(--shadow); position: relative;">

            <!-- Wizard Stepper -->
            <div
                style="display: flex; justify-content: space-between; margin-bottom: 3rem; position: relative; max-width: 600px; margin-left: auto; margin-right: auto;">
                <div
                    style="position: absolute; top: 15px; left: 0; width: 100%; height: 2px; background: #eee; z-index: 1;">
                </div>
                <div id="step-line"
                    style="position: absolute; top: 15px; left: 0; width: 0%; height: 2px; background: var(--accent-color); z-index: 1; transition: 0.3s;">
                </div>

                <div class="step-indicator active" data-step="1"
                    style="z-index: 2; background: var(--bg-primary); padding: 0 10px; display: flex; flex-direction: column; align-items: center; gap: 8px;">
                    <div class="step-circle"
                        style="width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--accent-color); background: var(--bg-primary); color: var(--accent-color); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem;">
                        1</div>
                    <span style="font-size: 0.75rem; font-weight: 600; color: var(--text-primary);">General</span>
                </div>
                <div class="step-indicator" data-step="2"
                    style="z-index: 2; background: var(--bg-primary); padding: 0 10px; display: flex; flex-direction: column; align-items: center; gap: 8px;">
                    <div class="step-circle"
                        style="width: 32px; height: 32px; border-radius: 50%; border: 2px solid #eee; background: var(--bg-primary); color: var(--text-secondary); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem;">
                        2</div>
                    <span style="font-size: 0.75rem; font-weight: 600; color: var(--text-secondary);">Space</span>
                </div>
                <div class="step-indicator" data-step="3"
                    style="z-index: 2; background: var(--bg-primary); padding: 0 10px; display: flex; flex-direction: column; align-items: center; gap: 8px;">
                    <div class="step-circle"
                        style="width: 32px; height: 32px; border-radius: 50%; border: 2px solid #eee; background: var(--bg-primary); color: var(--text-secondary); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem;">
                        3</div>
                    <span style="font-size: 0.75rem; font-weight: 600; color: var(--text-secondary);">Financial</span>
                </div>
                <div class="step-indicator" data-step="4"
                    style="z-index: 2; background: var(--bg-primary); padding: 0 10px; display: flex; flex-direction: column; align-items: center; gap: 8px;">
                    <div class="step-circle"
                        style="width: 32px; height: 32px; border-radius: 50%; border: 2px solid #eee; background: var(--bg-primary); color: var(--text-secondary); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem;">
                        4</div>
                    <span style="font-size: 0.75rem; font-weight: 600; color: var(--text-secondary);">Review</span>
                </div>
            </div>

            <form th:action="@{/agreements/save}" th:object="${agreement}" method="POST" id="agreementForm">

                <!-- Step 1: General Info -->
                <div class="wizard-step" id="step1">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-bottom: 20px;">
                        <div>
                            <label style="display:block; margin-bottom:8px; font-weight:600;">Select Tenant</label>
                            <select th:field="*{tenantId}" required
                                style="width:100%; padding:12px; border-radius:12px; border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--text-primary);">
                                <option value="">-- Select Tenant --</option>
                                <option th:each="t : ${tenants}" th:value="${t.id}" th:text="${t.companyName}">Tenant
                                    Name</option>
                            </select>
                        </div>
                        <div>
                            <label style="display:block; margin-bottom:8px; font-weight:600;">Agreement Type</label>
                            <select th:field="*{agreementType}" required
                                style="width:100%; padding:12px; border-radius:12px; border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--text-primary);">
                                <option value="NEW">New Lease</option>
                                <option value="RENEWAL">Renewal</option>
                            </select>
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 25px;">
                        <div>
                            <label style="display:block; margin-bottom:8px; font-weight:600;">Start Date</label>
                            <input type="date" th:field="*{startDate}" required
                                style="width:100%; padding:12px; border-radius:12px; border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--text-primary);">
                        </div>
                        <div>
                            <label style="display:block; margin-bottom:8px; font-weight:600;">End Date</label>
                            <input type="date" th:field="*{endDate}" required
                                style="width:100%; padding:12px; border-radius:12px; border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--text-primary);">
                        </div>
                    </div>
                </div>

                <!-- Step 2: Space Allocation -->
                <div class="wizard-step" id="step2" style="display:none;">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-bottom: 20px;">
                        <div>
                            <label style="display:block; margin-bottom:8px; font-weight:600;">Building</label>
                            <select th:field="*{buildingId}" id="buildingIdSelect" required
                                style="width:100%; padding:12px; border-radius:12px; border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--text-primary);">
                                <option value="">-- Select Building --</option>
                                <option th:each="b : ${buildings}" th:value="${b.id}" th:text="${b.name}">Building Name
                                </option>
                            </select>
                        </div>
                        <div>
                            <label style="display:block; margin-bottom:8px; font-weight:600;">Floor</label>
                            <select th:field="*{floorId}" id="floorIdSelect" required
                                style="width:100%; padding:12px; border-radius:12px; border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--text-primary);">
                                <option value="">-- Select Floor --</option>
                            </select>
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 25px;">
                        <div>
                            <label style="display:block; margin-bottom:8px; font-weight:600;">Agreement Area
                                (Sft)</label>
                            <input type="number" step="0.01" th:field="*{agreementAreaSft}" id="areaSftInput" required
                                style="width:100%; padding:12px; border-radius:12px; border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--text-primary);">
                        </div>
                        <div>
                            <label style="display:block; margin-bottom:8px; font-weight:600;">Agreement Number</label>
                            <input type="text" th:field="*{agreementNumber}" placeholder="Auto-generated if empty"
                                style="width:100%; padding:12px; border-radius:12px; border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--text-primary);">
                        </div>
                    </div>
                </div>

                <!-- Step 3: Financial Terms -->
                <div class="wizard-step" id="step3" style="display:none;">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-bottom: 20px;">
                        <div>
                            <label style="display:block; margin-bottom:8px; font-weight:600;">Rent Rate (৳ per
                                Sft)</label>
                            <input type="number" step="0.01" th:field="*{baseRentRatePerSft}" id="rentRateInput"
                                required
                                style="width:100%; padding:12px; border-radius:12px; border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--text-primary);">
                        </div>
                        <div>
                            <label style="display:block; margin-bottom:8px; font-weight:600;">Monthly Base Rent</label>
                            <input type="number" step="0.01" th:field="*{baseMonthlyRent}" id="monthlyRentInput"
                                required readonly
                                style="width:100%; padding:12px; border-radius:12px; border:1px solid var(--glass-border); background:rgba(0,0,0,0.05); color:var(--text-primary);">
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                        <div>
                            <label style="display:block; margin-bottom:8px; font-weight:600;">Service Charge</label>
                            <input type="number" step="0.01" th:field="*{serviceCharge}"
                                style="width:100%; padding:12px; border-radius:12px; border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--text-primary);">
                        </div>
                        <div>
                            <label style="display:block; margin-bottom:8px; font-weight:600;">VAT (%)</label>
                            <input type="number" step="0.01" th:field="*{vatPercent}"
                                style="width:100%; padding:12px; border-radius:12px; border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--text-primary);">
                        </div>
                        <div>
                            <label style="display:block; margin-bottom:8px; font-weight:600;">Tax Adjustment (%)</label>
                            <input type="number" step="0.01" th:field="*{taxPercent}"
                                style="width:100%; padding:12px; border-radius:12px; border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--text-primary);">
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 25px;">
                        <div>
                            <label style="display:block; margin-bottom:8px; font-weight:600;">Security Deposit</label>
                            <input type="number" step="0.01" th:field="*{securityDepositAmount}"
                                style="width:100%; padding:12px; border-radius:12px; border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--text-primary);">
                        </div>
                        <div>
                            <label style="display:block; margin-bottom:8px; font-weight:600;">Advance Payment</label>
                            <input type="number" step="0.01" th:field="*{advanceAmount}"
                                style="width:100%; padding:12px; border-radius:12px; border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--text-primary);">
                        </div>
                    </div>
                </div>

                <!-- Step 4: Review & Clauses -->
                <div class="wizard-step" id="step4" style="display:none;">
                    <div
                        style="background: rgba(0, 119, 204, 0.05); padding: 1.5rem; border-radius: 16px; margin-bottom: 20px;">
                        <h4 style="margin-bottom: 10px; font-weight: 700;">Lease Summary</h4>
                        <div id="summaryContent" style="font-size: 0.9rem; line-height: 1.6;">
                            <!-- Populated via JS -->
                        </div>
                    </div>
                    <div>
                        <label style="display:block; margin-bottom:8px; font-weight:600;">Additional Clauses /
                            Remarks</label>
                        <textarea th:field="*{remarks}" rows="4"
                            style="width:100%; padding:12px; border-radius:12px; border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--text-primary); resize: vertical;"></textarea>
                    </div>
                </div>

                <!-- Navigation Buttons -->
                <div style="display: flex; justify-content: space-between; margin-top: 3rem;">
                    <button type="button" id="prevBtn" onclick="nextPrev(-1)"
                        style="display:none; padding:12px 24px; border-radius:12px; border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--text-primary); font-weight:600; cursor:pointer;">Previous</button>
                    <button type="button" id="nextBtn" onclick="nextPrev(1)"
                        style="padding:12px 24px; border-radius:12px; border:none; background:var(--accent-color); color:white; font-weight:600; cursor:pointer; margin-left:auto;">Next</button>
                    <button type="submit" id="submitBtn"
                        style="display:none; padding:12px 24px; border-radius:12px; border:none; background:var(--success); color:white; font-weight:600; cursor:pointer; margin-left:auto;">Confirm
                        & Create Lease</button>
                </div>
            </form>
        </div>
    </div>

    <script th:inline="javascript">
        let currentStep = 1;
        const totalSteps = 4;

        function showStep(n) {
            const steps = document.getElementsByClassName("wizard-step");
            for (let i = 0; i < steps.length; i++) {
                steps[i].style.display = "none";
            }
            document.getElementById("step" + n).style.display = "block";

            // Update line and indicators
            document.getElementById("step-line").style.width = ((n - 1) / (totalSteps - 1) * 100) + "%";
            const indicators = document.getElementsByClassName("step-indicator");
            for (let i = 0; i < indicators.length; i++) {
                const step = parseInt(indicators[i].getAttribute("data-step"));
                const circle = indicators[i].querySelector(".step-circle");
                if (step < n) {
                    circle.style.background = "var(--accent-color)";
                    circle.style.color = "white";
                    circle.style.borderColor = "var(--accent-color)";
                } else if (step === n) {
                    circle.style.background = "var(--bg-primary)";
                    circle.style.color = "var(--accent-color)";
                    circle.style.borderColor = "var(--accent-color)";
                } else {
                    circle.style.background = "var(--bg-primary)";
                    circle.style.color = "var(--text-secondary)";
                    circle.style.borderColor = "#eee";
                }
            }

            // Buttons visibility
            if (n === 1) {
                document.getElementById("prevBtn").style.display = "none";
            } else {
                document.getElementById("prevBtn").style.display = "inline-block";
            }

            if (n === totalSteps) {
                document.getElementById("nextBtn").style.display = "none";
                document.getElementById("submitBtn").style.display = "inline-block";
                updateSummary();
            } else {
                document.getElementById("nextBtn").style.display = "inline-block";
                document.getElementById("submitBtn").style.display = "none";
            }
        }

        function nextPrev(n) {
            if (n === 1 && !validateForm()) return false;
            currentStep += n;
            if (currentStep > totalSteps) {
                return false;
            }
            showStep(currentStep);
        }

        function validateForm() {
            // Basic validation
            const stepDiv = document.getElementById("step" + currentStep);
            const inputs = stepDiv.querySelectorAll("input[required], select[required]");
            let valid = true;
            inputs.forEach(input => {
                if (!input.value) {
                    input.style.borderColor = "var(--error)";
                    valid = false;
                } else {
                    input.style.borderColor = "var(--glass-border)";
                }
            });
            return valid;
        }

        // Calculation logic
        const areaInput = document.getElementById("areaSftInput");
        const rateInput = document.getElementById("rentRateInput");
        const monthlyInput = document.getElementById("monthlyRentInput");

        function calculateRent() {
            const area = parseFloat(areaInput.value) || 0;
            const rate = parseFloat(rateInput.value) || 0;
            monthlyInput.value = (area * rate).toFixed(2);
        }

        areaInput.addEventListener("input", calculateRent);
        rateInput.addEventListener("input", calculateRent);

        // Dynamic Floors
        document.getElementById("buildingIdSelect").addEventListener("change", function () {
            const buildingId = this.value;
            const floorSelect = document.getElementById("floorIdSelect");
            floorSelect.innerHTML = '<option value="">-- Select Floor --</option>';

            if (buildingId) {
                fetch('/agreements/api/buildings/' + buildingId + '/floors')
                    .then(response => response.json())
                    .then(floors => {
                        floors.forEach(f => {
                            const option = document.createElement("option");
                            option.value = f.id;
                            option.text = f.floorName + " (" + f.availableAreaSft + " Sft available)";
                            option.dataset.available = f.availableAreaSft;
                            floorSelect.appendChild(option);
                        });
                    });
            }
        });

        document.getElementById("floorIdSelect").addEventListener("change", function () {
            const selectedOption = this.options[this.selectedIndex];
            if (selectedOption.value) {
                areaInput.value = selectedOption.dataset.available;
                calculateRent();
            }
        });

        function updateSummary() {
            const tenant = document.querySelector('select[name="tenantId"] option:checked').text;
            const start = document.querySelector('input[name="startDate"]').value;
            const end = document.querySelector('input[name="endDate"]').value;
            const area = areaInput.value;
            const rent = monthlyInput.value;

            document.getElementById("summaryContent").innerHTML = `
                <p><strong>Tenant:</strong> ${tenant}</p>
                <p><strong>Period:</strong> ${start} to ${end}</p>
                <p><strong>Space:</strong> ${area} Sft</p>
                <p><strong>Monthly Rent:</strong> ৳ ${rent}</p>
            `;
        }

        // Initialize
        showStep(currentStep);
    </script>

    <style>
        .step-indicator {
            transition: 0.3s;
        }

        .wizard-step {
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</body>

</html>
