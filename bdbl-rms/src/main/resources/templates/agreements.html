<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head th:replace="~{layout :: head('Agreements')}"></head>

<body>

    <div th:replace="~{layout :: sidebar('agreements')}"></div>

    <div class="main-content">
        <style>
            .header {
                margin-bottom: 2.5rem;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .breadcrumb {
                color: var(--text-secondary);
                font-size: 0.88rem;
                margin-bottom: 6px;
            }

            h1 {
                font-size: 1.8rem;
                font-weight: 700;
                color: var(--text-primary);
            }

            /* Stepper */
            .stepper {
                display: flex;
                justify-content: space-between;
                margin-bottom: 3rem;
                position: relative;
            }

            .stepper::before {
                content: '';
                position: absolute;
                top: 15px;
                left: 0;
                width: 100%;
                height: 2px;
                background: var(--glass-border);
                z-index: 1;
            }

            .step {
                position: relative;
                z-index: 2;
                background: var(--bg-color);
                padding: 0 10px;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 8px;
            }

            .step-circle {
                width: 32px;
                height: 32px;
                border-radius: 50%;
                border: 2px solid var(--glass-border);
                background: var(--glass-bg);
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: 600;
                font-size: 0.85rem;
                color: var(--text-secondary);
            }

            .dark .step-circle {
                background: var(--bg-color);
            }

            .step.active .step-circle {
                background: var(--accent-color);
                border-color: var(--accent-color);
                color: white;
            }

            .step.completed .step-circle {
                background: var(--success);
                border-color: var(--success);
                color: white;
            }

            .step-label {
                font-size: 0.78rem;
                font-weight: 500;
                color: var(--text-secondary);
            }

            .step.active .step-label {
                color: var(--accent-color);
                font-weight: 700;
            }

            .step.completed .step-label {
                color: var(--success);
            }

            /* Form */
            .form-grid {
                display: grid;
                grid-template-columns: 2fr 1fr;
                gap: 35px;
            }

            @media (max-width: 1024px) {
                .form-grid {
                    grid-template-columns: 1fr;
                }
            }

            .form-card {
                background: var(--glass-bg);
                border-radius: 20px;
                padding: 2.5rem;
                box-shadow: var(--shadow);
                border: 1px solid var(--glass-border);
            }

            .form-section {
                margin-bottom: 2rem;
            }

            .form-section h3 {
                font-size: 1rem;
                font-weight: 700;
                margin-bottom: 1.5rem;
                padding-bottom: 0.5rem;
                border-bottom: 1px solid var(--glass-border);
                color: var(--text-primary);
            }

            .input-group {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
                margin-bottom: 1.5rem;
            }

            .field {
                display: flex;
                flex-direction: column;
                gap: 7px;
            }

            .field label {
                font-size: 0.8rem;
                font-weight: 600;
                color: var(--text-primary);
                text-transform: uppercase;
                letter-spacing: 0.04em;
            }

            .field input,
            .field select {
                padding: 11px 14px;
                border: 1px solid var(--glass-border);
                border-radius: 10px;
                font-size: 0.9rem;
                color: var(--text-primary);
                background: rgba(0, 0, 0, 0.02);
                transition: 0.2s;
                outline: none;
            }

            .dark .field input,
            .dark .field select {
                background: rgba(255, 255, 255, 0.02);
            }

            .field input:focus,
            .field select:focus {
                border-color: var(--accent-color);
                box-shadow: 0 0 0 3px rgba(0, 119, 204, 0.1);
            }

            .dark .field input:focus,
            .dark .field select:focus {
                background: rgba(255, 255, 255, 0.05);
            }

            /* Summary Panel */
            .summary-card {
                background: var(--accent-color);
                color: white;
                padding: 2rem;
                border-radius: 20px;
                position: sticky;
                top: 2rem;
                height: fit-content;
                box-shadow: 0 8px 30px rgba(0, 119, 204, 0.3);
            }

            .dark .summary-card {
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            }

            .summary-title {
                font-size: 1.1rem;
                font-weight: 700;
                margin-bottom: 1.5rem;
                border-bottom: 1px solid rgba(255, 255, 255, 0.25);
                padding-bottom: 0.75rem;
            }

            .summary-item {
                display: flex;
                justify-content: space-between;
                margin-bottom: 12px;
                font-size: 0.88rem;
                opacity: 0.9;
            }

            .summary-total {
                margin-top: 20px;
                padding-top: 15px;
                border-top: 1px solid rgba(255, 255, 255, 0.25);
                font-size: 1.25rem;
                font-weight: 700;
                display: flex;
                justify-content: space-between;
            }

            .summary-note {
                font-size: 0.73rem;
                margin-top: 14px;
                opacity: 0.75;
            }

            .btn-group {
                margin-top: 2rem;
                display: flex;
                justify-content: flex-end;
                gap: 12px;
            }

            .btn {
                padding: 11px 28px;
                border-radius: 10px;
                font-weight: 600;
                cursor: pointer;
                transition: 0.25s;
                border: none;
                font-size: 0.9rem;
            }

            .btn-secondary {
                background: var(--glass-bg);
                color: var(--text-secondary);
                border: 1px solid var(--glass-border);
            }

            .btn-secondary:hover {
                border-color: var(--text-primary);
                color: var(--text-primary);
            }

            .btn-primary {
                background: var(--accent-color);
                color: white;
                box-shadow: 0 2px 10px rgba(0, 119, 204, 0.25);
            }

            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 4px 18px rgba(0, 119, 204, 0.35);
            }

            .btn-draft {
                background: var(--glass-bg);
                color: var(--text-secondary);
                border: 1px solid var(--glass-border);
                padding: 9px 18px;
                border-radius: 9px;
                font-weight: 600;
                cursor: pointer;
                font-size: 0.85rem;
            }

            .dark .btn-draft:hover {
                border-color: var(--text-primary);
                color: var(--text-primary);
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .main-content>* {
                animation: fadeIn 0.6s ease forwards;
            }
        </style>

        <div class="header">
            <div>
                <h1>Lease Agreements</h1>
                <p class="breadcrumb">Manage and view all tenant lease agreements.</p>
            </div>
            <a th:href="@{/agreements/new}" class="btn-primary"
                style="text-decoration: none; padding: 10px 20px; border-radius: 10px; display: inline-flex; align-items: center; gap: 8px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                New Lease
            </a>
        </div>

        <div th:if="${successMessage}"
            style="background: #d1fae5; color: #065f46; padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem; border: 1px solid #10b981;">
            <span th:text="${successMessage}">Success!</span>
        </div>
        <div th:if="${errorMessage}"
            style="background: #fee2e2; color: #991b1b; padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem; border: 1px solid #ef4444;">
            <span th:text="${errorMessage}">Error!</span>
        </div>

        <div style="display: flex; gap: 12px; margin-bottom: 1.5rem;">
            <input type="text" placeholder="Search agreement # or tenant..."
                style="padding: 10px 18px; border-radius: 12px; border: 1px solid var(--glass-border); background: var(--glass-bg); color: var(--text-primary); outline: none; width: 300px; transition: 0.3s;">
        </div>

        <div
            style="background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; padding: 1.5rem; box-shadow: var(--shadow); overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr>
                        <th
                            style="text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--glass-border); color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase;">
                            Agreement #</th>
                        <th
                            style="text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--glass-border); color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase;">
                            Tenant</th>
                        <th
                            style="text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--glass-border); color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase;">
                            Building</th>
                        <th
                            style="text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--glass-border); color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase;">
                            Duration</th>
                        <th
                            style="text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--glass-border); color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase;">
                            Monthly Rent</th>
                        <th
                            style="text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--glass-border); color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase;">
                            Status</th>
                        <th
                            style="text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--glass-border); color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase;">
                            Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(agreements)}">
                        <td colspan="7" style="text-align: center; padding: 2rem; color: var(--text-secondary);">
                            No lease agreements found.
                        </td>
                    </tr>
                    <tr th:each="agreement : ${agreements}" style="border-bottom: 1px solid rgba(0,0,0,0.03);">
                        <td style="padding: 14px; font-weight: 600; font-family: monospace;"
                            th:text="${agreement.agreementNumber}">AGR-001</td>
                        <td style="padding: 14px; font-weight: 600;" th:text="${agreement.tenantCompanyName}">Tenant
                            Name</td>
                        <td style="padding: 14px;" th:text="${agreement.buildingName}">Building Name</td>
                        <td style="padding: 14px; font-size: 0.85rem;">
                            <span th:text="${#temporals.format(agreement.startDate, 'dd MMM yyyy')}">01 Jan
                                2026</span><br>
                            to <span th:text="${#temporals.format(agreement.endDate, 'dd MMM yyyy')}">31 Dec 2028</span>
                        </td>
                        <td style="padding: 14px; font-weight: 600;"
                            th:text="${agreement.totalMonthlyRent != null ? '৳ ' + #numbers.formatDecimal(agreement.totalMonthlyRent, 0, 'COMMA', 2, 'POINT') : '৳ 0'}">
                            ৳ 0</td>
                        <td style="padding: 14px;">
                            <span th:if="${agreement.status == 'ACTIVE'}"
                                style="background: #d1fae5; color: #065f46; padding: 4px 10px; border-radius: 50px; font-size: 0.72rem; font-weight: 700;">ACTIVE</span>
                            <span th:if="${agreement.status == 'EXPIRED'}"
                                style="background: #fee2e2; color: #991b1b; padding: 4px 10px; border-radius: 50px; font-size: 0.72rem; font-weight: 700;">EXPIRED</span>
                            <span th:if="${agreement.status != 'ACTIVE' and agreement.status != 'EXPIRED'}"
                                style="background: var(--glass-bg); color: var(--text-secondary); padding: 4px 10px; border-radius: 50px; font-size: 0.72rem; font-weight: 700; border: 1px solid var(--glass-border);"
                                th:text="${agreement.status}">DRAFT</span>
                        </td>
                        <td style="padding: 14px;">
                            <a href="#"
                                style="color: var(--text-secondary); text-decoration: none; font-size: 0.85rem; font-weight: 600;">View</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>

</html>
